[package]
name = 'ahocorasick'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'ahocorasick'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
aho-corasick = "1"
extendr-api = '0.9.0'

[profile.release]
lto = true
codegen-units = 1
