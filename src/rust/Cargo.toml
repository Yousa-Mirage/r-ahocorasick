[package]
name = 'ahocorasick'
publish = false
version = '0.3.0'
edition = '2024'
rust-version = '1.85'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'ahocorasick'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
aho-corasick = "1"
extendr-api = '0.9.0'

[lints.rust]
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"
