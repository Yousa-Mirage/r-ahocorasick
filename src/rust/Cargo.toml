[package]
name = "ahocorasick"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]
name = "ahocorasick"

[[bin]]
name = "document"
path = "document.rs"

[dependencies]
aho-corasick = "1.1.5"
extendr-api = "0.9.0"
simdutf8 = "0.1.5"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[lints.rust]
warnings = "deny"

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "unwind"
codegen-units = 1
